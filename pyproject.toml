[project]
name = "data-platform-copilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40", "httpx>=0.27", "pydantic>=2.7", "python-dotenv>=1.0",
]
[project.optional-dependencies]
app = ["langgraph>=1.0", "langgraph-checkpoint-sqlite", "langchain-anthropic", "langchain-ollama",
       "mcp", "duckdb", "chromadb", "rank-bm25", "fastapi", "uvicorn", "langfuse", "scikit-learn"]
[dependency-groups]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6", "pre-commit"]
[tool.uv]
package = false
[tool.ruff]
line-length = 110
target-version = "py311"
[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["live: hits a real LLM/API"]
